name: Update vpn.txt

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process file
        run: |
          curl -L "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt" \
          | grep -v '^#' \
          | sed '/^\s*$/d' > vpn.txt

      - name: Commit and push if changed
        run: |
          git config user.name "AugustCorvin"
          git config user.email "255298133+AugustCorvin@users.noreply.github.com"

          git add vpn.txt

          git diff --cached --quiet && exit 0

          git commit -m "Update vpn.txt"
          git push
